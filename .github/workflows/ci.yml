# dsh-shift-router — continuous integration
#
# The gates themselves are defined in SPEC §14 and run identically on a laptop
# (`npm run typecheck && npm run build && npm test`). CI exists so that a green
# laptop is not the only evidence: every push and pull request re-runs them on
# the two Node lines this package supports.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Upstream's gate order: build before test, so a build break is reported
      # before a test break that may be its symptom.
      - run: npm run build
      - run: npm run test:coverage

  e2e:
    name: e2e (install + boot)
    runs-on: ubuntu-latest
    # INFORMATIONAL, not a blocking gate (SPEC §14: `gates` is the blocking one).
    # This job must fetch the harness CLI from npm, and npm's view of the harness
    # is upstream-controlled and currently broken: `@deepseek-ai/dsh@0.1.5-rc.2`
    # resolves a closure that requires `@deepseek-ai/dsh-client-ui-sidebar-documentpreview@^0.1.5-rc.3`,
    # which is NOT published (that package has only alpha.2/rc.1/rc.2/0.1.6-alpha.*)
    # while other harness packages already are at rc.3 — the upstream rc.3 publish
    # is half-done. Result: ETARGET, reproducibly, from a cold cache against
    # registry.npmjs.org. Three runs failed here for three different reasons
    # (30-min silent hang on `npm i -g`; pnpm missing on the runner; this ETARGET),
    # and two of the three were not our code. A red X that means "upstream is
    # mid-publish" trains people to ignore red, so the job stays visible but
    # cannot fail the build. The e2e is AUTHORITATIVE when run locally against an
    # installed harness — that is how it caught the boot-aborting defect (§R3).
    continue-on-error: true
    # The credential-free e2e needs the `dsh` CLI and pnpm, and it builds a
    # scratch profile by installing real packages. That is exactly the path that
    # once shipped a boot-aborting defect (ALIGNMENT §R3), so it runs on main
    # instead of being left to the maintainer's laptop. It is kept as its own job
    # so a failure is attributable to the install path rather than to a unit test.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'
          cache: npm
      # `dsh plugin ... add` shells out to pnpm on PATH (the official publish doc
      # says so, and the GitHub-hosted Ubuntu runner has no pnpm by default). The
      # first run failed with `dsh: pnpm not found on PATH — install pnpm to manage
      # profile plugins`, which then cascaded into every later assertion; this
      # installs pnpm for the rest of the job.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: npm ci
      - run: npm run build
      # Resolve the `dsh` bin through npx into a per-step cache (no system write),
      # then hand it to the e2e (`run-e2e.mjs` honours $DSH_BIN) — the same path the
      # maintainer's laptop uses. `npm i -g` was tried first and hung on a fresh
      # runner with no log output for 30+ minutes.
      #
      # `shell: bash` with `-eo pipefail` and an explicit emptiness check: a step
      # whose output never got set leaves the next step with `DSH_BIN=""`, and `""`
      # is a *set* value — it does not fall back the way an unset variable does.
      # Failing here names the real problem instead of crashing later.
      - name: resolve dsh via npx
        id: dsh
        shell: bash
        run: |
          set -euo pipefail
          bin="$(npx -y -p @deepseek-ai/dsh@0.1.5-rc.2 -- which dsh)"
          if [ -z "$bin" ]; then
            echo "::error::could not resolve the dsh bin via npx (see the npx output above)"
            exit 1
          fi
          "$bin" --version
          echo "DSH_BIN=$bin" >> "$GITHUB_OUTPUT"
      - name: run e2e
        run: DSH_BIN="${{ steps.dsh.outputs.DSH_BIN }}" npm run test:e2e
